# 도구 선택 평가 게이트(N055 6장). 모델이 41개 메시지에서 도구와 인자를 맞히는지 실제 LLM 으로 두 번 돌려, 기준에 못 미치면 실패로 끝난다.
# 실제 LLM 을 부르므로(41개 x 2회) PR마다 자동으로 돌리지 않는다. 아래 둘 중 하나일 때만 돈다.
#   1) PR 에 `eval` 라벨을 붙였을 때(같은 저장소의 PR 만. 포크 PR 에는 시크릿이 가지 않으므로 건너뛴다)
#   2) Actions > eval > Run workflow 버튼
# 사용법: 저장소 Settings > Secrets and variables > Actions 에 시크릿 LLM_API_KEY 를 등록한다(OpenAI 키).
# 기준: 도구와 인자 모두 정답 33개 이상(41개 중, 모든 회차), 그리고 T34(시험 전날 날짜 계산)는 모든 회차에서 정답.
#   33 은 choose() 전체 경로의 지난 7번 결과(35~39)의 최솟값 35 에서 2를 뺀 값이다. 항상 틀리는 T16·T33 이 있어 41개를 요구하지 않는다(docs/eval-gate.md).
name: eval

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'eval' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: eval-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: 도구 선택 평가 (기준에 못 미치면 실패)
        # 시크릿은 이 단계에서만 환경변수로 준다. Langfuse 키는 넣지 않으므로 코드의 지시문(production 버전과 같은 문장)으로 평가한다.
        env:
          LLM_PROVIDER: openai
          LLM_MODEL: gpt-4o-mini
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          STORAGE: memory
          AUTH: none
          LANGFUSE_TRACING_ENABLED: "false"
        run: |
          set -euo pipefail
          if [ -z "$LLM_API_KEY" ]; then
            echo "시크릿 LLM_API_KEY 가 없어 평가할 수 없다. 저장소 Settings > Secrets and variables > Actions 에 등록한다"
            exit 1
          fi
          python scripts/eval_tools.py --full --repeat 2 --min-exact 41 --must-pass T34 | tee -a "$GITHUB_STEP_SUMMARY"
